[project]
name = "autotrade"
version = "0.1.0"
description = "台股記憶體產業資訊監測與 AI 摘要系統"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
autotrade = "autotrade.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
